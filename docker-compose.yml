# The test databases, see "Running the tests" in doc/guide/contributing.md.
# The host ports are unusual on purpose, so they don't collide with databases
# that may already be installed locally.
name: objection

services:
  postgres:
    image: 'postgres:17'
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c random_page_cost=1.0
    ports:
      - '55432:5432'
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=objection
      - POSTGRES_DB=objection_test
    healthcheck:
      # Connect over TCP, which only works once the initialization is done.
      test: pg_isready -h 127.0.0.1 -U objection -d objection_test
      interval: 1s
      retries: 60
  mysql:
    image: 'mysql:8.4'
    # The mysql driver only supports mysql_native_password, which MySQL 8.4
    # disables by default. Enable it and make it the default for new users.
    command: --mysql-native-password=ON --authentication-policy=mysql_native_password
    ports:
      - '33306:3306'
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=objection_test
    configs:
      - source: mysql-init
        target: /docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # Connect over TCP, which only works once the initialization is done.
      test: mysqladmin ping -h 127.0.0.1 -u objection
      interval: 1s
      retries: 60

  mssql:
    image: 'mcr.microsoft.com/mssql/server:2022-latest'
    # There is no arm64 image of SQL Server.
    platform: linux/amd64
    # Only started on request, e.g. `npm run db:up -- mssql`, as the image is
    # large and runs emulated on arm64.
    profiles: [mssql]
    ports:
      - '51433:1433'
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Objection1!
    healthcheck:
      # The image can't create a database on its own, so the healthcheck creates
      # it once the server accepts connections.
      test: /opt/mssql-tools18/bin/sqlcmd -C -S 127.0.0.1 -U sa -P "$$MSSQL_SA_PASSWORD" -Q "IF DB_ID('objection_test') IS NULL CREATE DATABASE objection_test"
      interval: 2s
      retries: 60

configs:
  mysql-init:
    # The image can only create users with a password. The tests create
    # databases, so the user needs more than access to objection_test.
    content: |
      CREATE USER objection;
      GRANT ALL PRIVILEGES ON *.* TO objection;
