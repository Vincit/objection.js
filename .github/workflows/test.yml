name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [16.x, 18.x, 20.x, 22.x, 24.x]
        knex: [default]
        mysql: ['8.4']
        # Also test the oldest supported knex version and MySQL 5.7, each as a
        # separate job.
        include:
          - node-version: 16.x
            knex: 2.3.0
            mysql: '8.4'
          - node-version: 24.x
            knex: default
            mysql: '5.7'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Install knex ${{ matrix.knex }}
        if: matrix.knex != 'default'
        run: npm install --no-save knex@${{ matrix.knex }}

      # The generated parsers have to match their grammars. One job is enough.
      - name: Check the generated parsers
        if: matrix.node-version == '24.x' && matrix.knex == 'default' && matrix.mysql == '8.4'
        run: |
          npm run build:parsers
          git diff --exit-code lib/queryBuilder/parsers

      # The documented minimum TypeScript version has to compile the typings
      # and their tests. One job is enough.
      - name: Check the typings with TypeScript 5.1
        if: matrix.node-version == '24.x' && matrix.knex == 'default' && matrix.mysql == '8.4'
        run: npx --yes -p typescript@5.1.6 tsc

      - name: Start test databases
        env:
          COMPOSE_FILE: ${{ matrix.mysql == '5.7' && 'docker-compose.yml:docker-compose.mysql57.yml' || 'docker-compose.yml' }}
          # The MySQL 5.7 job only needs MySQL, all services start otherwise.
          SERVICES: ${{ matrix.mysql == '5.7' && 'mysql' || '' }}
        run: |
          # Retry the pull, public.ecr.aws rate limits anonymous pulls.
          for i in 1 2 3 4 5; do
            docker compose pull $SERVICES && break
            sleep $((i * 15))
          done
          npm run db:up -- $SERVICES

      - name: Run tests
        if: matrix.knex == 'default' && matrix.mysql != '5.7'
        run: npm test

      # The typings of older knex versions don't compile with current
      # TypeScript, so only the test suite runs against them. The MySQL 5.7 job
      # only runs the MySQL tests, the other jobs already lint and check typings.
      - name: Run tests without linting and typings
        if: matrix.knex != 'default' || matrix.mysql == '5.7'
        env:
          DATABASES: ${{ matrix.mysql == '5.7' && 'mysql' || '' }}
        run: npx mocha --slow 10 --timeout 15000 --reporter spec --recursive tests --exclude "tests/unit/relations/files/**"
